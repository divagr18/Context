# test-ood split: lexically-disjoint OOD domain (logistics_ops), final eval only.
split: test-ood
kind: single_shot
domain: logistics_ops
doc_len_name: short
n_docs: 100
seed: 45678
paraphrase_idx_range: [0, 5]
decoys_per_queried: [1, 3]
chain_fraction: 0.3
chain_depth_max: 3
multihop_doc_fraction: 0.15
queried_per_100_tokens: 1.0
streaming_ratio: 8
window_tokens: 2048
window_overlap_frac: 0.10

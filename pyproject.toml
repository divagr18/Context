[project]
name = "track-a-coompaction"
version = "0.1.0"
description = "Track A: attention-vs-FFN capacity ablation for context compaction"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "tqdm>=4.66",
    "transformers>=4.50",
    "tensorboard>=2.16",
    "matplotlib>=3.8",
    "pytest>=8",
]

# NOTE: torch is installed separately (needs the CUDA wheel index):
#   uv pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cu128
# Same pin on Windows dev box and RunPod image (see track_a/docs/RUNPOD.md).

# Explicit package discovery: only `track_a` is a Python package. Without this,
# setuptools flat-layout auto-discovery sees both `configs/` and `track_a/`
# and refuses to build (breaks `pip install -e .` on the RunPod pod).
[tool.setuptools.packages.find]
include = ["track_a*"]

[tool.pytest.ini_options]
testpaths = ["track_a/tests"]
addopts = "-q"

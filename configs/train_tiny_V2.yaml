run_tag: tiny-V2
seed: 11
model:
  scale: tiny
  variant: V2
framing: single_shot
data:
  train_shards:
    - data/shards/train.jsonl
  val_shards:
    - data/shards/val.jsonl
training:
  total_tokens: 500000000
  effective_batch_tokens: 262144
  max_seq: 13824
  lr: 0.0006
  warmup_frac: 0.02
  min_lr_frac: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  use_bf16: true
recall_shaping:
  every: 100
  subsample: 8
  lambda_drop: 5.0
  lambda_waste: 1.0
aux:
  coref: false
  temporal: false
  negation: false
  binding_attn: false
  salience: false
logging:
  run_dir: runs
  log_every: 10
checkpoint:
  save_every_steps: 200
eval:
  every_steps: 200
  val_max_samples: 32
